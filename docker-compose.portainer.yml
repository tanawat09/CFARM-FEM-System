services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cfarm-fem-app:v2
    container_name: fem_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_NAME: "${APP_NAME:-CFARM FEM System}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-base64:PYR5HggloJHaQDjmlFUoQ/dWyrS7ovIpOS/vHA3NNQ4=}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://192.168.7.3:8019}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-192.168.7.3}"
      DB_PORT: "${DB_PORT:-3308}"
      DB_DATABASE: "${DB_DATABASE:-fire_extinguisher_db}"
      DB_USERNAME: "${DB_USERNAME:-itadmin}"
      DB_PASSWORD: "${DB_PASSWORD:-Noipalee@09}"
      SESSION_COOKIE: "${SESSION_COOKIE:-cfarm_fem_session}"
      SESSION_DRIVER: "${SESSION_DRIVER:-file}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"
      SESSION_SAME_SITE: "${SESSION_SAME_SITE:-lax}"
    volumes:
      - fem_storage:/var/www/storage
    networks:
      - fem_network

  webserver:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: cfarm-fem-webserver:v2
    container_name: fem_webserver
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8019}:80"
    networks:
      - fem_network
    depends_on:
      - app

  scheduler:
    image: cfarm-fem-app:v2
    container_name: fem_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    environment:
      APP_NAME: "${APP_NAME:-CFARM FEM System}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-base64:PYR5HggloJHaQDjmlFUoQ/dWyrS7ovIpOS/vHA3NNQ4=}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://192.168.7.3:8019}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-192.168.7.3}"
      DB_PORT: "${DB_PORT:-3308}"
      DB_DATABASE: "${DB_DATABASE:-fire_extinguisher_db}"
      DB_USERNAME: "${DB_USERNAME:-itadmin}"
      DB_PASSWORD: "${DB_PASSWORD:-Noipalee@09}"
      SESSION_COOKIE: "${SESSION_COOKIE:-cfarm_fem_session}"
      SESSION_DRIVER: "${SESSION_DRIVER:-file}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"
      SESSION_SAME_SITE: "${SESSION_SAME_SITE:-lax}"
    volumes:
      - fem_storage:/var/www/storage
    networks:
      - fem_network
    depends_on:
      - app

networks:
  fem_network:
    driver: bridge

volumes:
  fem_storage:
